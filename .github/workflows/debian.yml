name: debian build

on:
  # By hand only: Actions -> debian build -> Run workflow, picking the version
  # branch. A push deploys nothing, so a version branch can be created or
  # patched safely.
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    # The Docker Hub secrets live in this environment, so a workflow that does
    # not name it, such as one left on an older version branch, cannot push.
    environment: dockerhub
    strategy:
      matrix:
        debian_version: [bookworm, trixie]  # Builds for Bookworm and Trixie

    steps:
      - name: Check the matching release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Images go out only for a version agensgraph has released: the branch
          # this runs on must be named after a published release there. A
          # pre-release counts, so a candidate still gets its images; a draft or
          # a bare tag does not.
          BRANCH_NAME="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != branch ] || [[ "$BRANCH_NAME" != v* ]]; then
            echo "::error::Run this on a version branch, not $GITHUB_REF_TYPE $BRANCH_NAME"
            exit 1
          fi
          if ! DRAFT="$(gh api "repos/skaiworldwide-oss/agensgraph/releases/tags/$BRANCH_NAME" --jq .draft)"; then
            echo "::error::agensgraph has no release $BRANCH_NAME; nothing is pushed"
            exit 1
          fi
          if [ "$DRAFT" != false ]; then
            echo "::error::Release $BRANCH_NAME is still a draft; nothing is pushed"
            exit 1
          fi
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Parent Version
        run: |
          # The line folder is the version without its last component: v2.18.4.0
          # sits under v2.18.4, and the older v2.17.0 under v2.17.
          version="${BRANCH_NAME#v}"
          IFS='.' read -r major minor patch build <<< "$version"
          if [ -n "$build" ]; then
            echo "PARENT_VERSION=v$major.$minor.$patch" >> $GITHUB_ENV
          else
            echo "PARENT_VERSION=v$major.$minor" >> $GITHUB_ENV
          fi

      - name: Build and push ${{ matrix.debian_version }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PARENT_VERSION }}/${{ env.BRANCH_NAME }}/${{ matrix.debian_version }}/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agensgraph:${{ env.BRANCH_NAME }}-${{ matrix.debian_version }}
