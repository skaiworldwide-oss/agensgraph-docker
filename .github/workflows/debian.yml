name: debian build

on:
  push:
    branches:
      - 'v*'   # a branch per version, named after its upstream tag

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian_version: [bookworm, trixie]  # Builds for Bookworm and Trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract branch name
        id: extract_branch
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Extract Parent Version
        run: |
          # The line folder is the version without its last component: v2.18.4.0
          # sits under v2.18.4, the release candidate v2.18.6.0-rc1 under
          # v2.18.6, and the older v2.17.0 under v2.17.
          version="${BRANCH_NAME#v}"
          IFS='.' read -r major minor patch build <<< "$version"
          if [ -n "$build" ]; then
            echo "PARENT_VERSION=v$major.$minor.$patch" >> $GITHUB_ENV
          else
            echo "PARENT_VERSION=v$major.$minor" >> $GITHUB_ENV
          fi

      - name: Build and push ${{ matrix.debian_version }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PARENT_VERSION }}/${{ env.BRANCH_NAME }}/${{ matrix.debian_version }}/
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agensgraph:${{ env.BRANCH_NAME }}-${{ matrix.debian_version }}
