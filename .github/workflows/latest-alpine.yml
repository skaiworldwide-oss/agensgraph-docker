name: latest build

on:
  push:
    branches:
      - 'master'
  # Publishing a release does not reach this repository, so latest is rebuilt
  # by hand right after it: gh workflow run latest-alpine.yml --ref master
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Find the latest released version
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/agensgraph:latest
        run: |
          # latest follows the newest published release of the agensgraph
          # repository, not the highest folder on master, so that a folder merged
          # ahead of its release never reaches latest. releases/latest skips
          # drafts and pre-releases.
          TAG="$(gh api repos/skaiworldwide-oss/agensgraph/releases/latest --jq .tag_name)"

          # latest is pushed only for a release newer than the version it holds,
          # read from AG_VERSION in the image. An equal version is not rebuilt, so
          # a push to master that brings no new release deploys nothing, and a
          # patch to an older line, which is marked as the latest release by
          # default once published, never moves latest back.
          CURRENT="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' |
            jq -r '(if .config then .config.Env else (to_entries[0].value.config.Env) end)[]
                   | select(startswith("AG_VERSION=")) | sub("^AG_VERSION="; "")')"
          NEWEST="$(printf '%s\n' "${CURRENT#v}" "${TAG#v}" | sort -V | tail -n1)"
          if [ -n "$CURRENT" ] && { [ "${TAG#v}" = "${CURRENT#v}" ] || [ "$NEWEST" != "${TAG#v}" ]; }; then
            echo "::notice::Release $TAG is not newer than latest ($CURRENT); latest is left as it is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIRS=(v*/"$TAG"/)
          if [ ${#DIRS[@]} -ne 1 ] || [ ! -d "${DIRS[0]}" ]; then
            echo "No single version folder for release $TAG" >&2
            exit 1
          fi
          echo "SUB_DIR=./${DIRS[0]}" >> $GITHUB_ENV

      - name: Build and push
        if: steps.find.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SUB_DIR }}alpine3.24/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agensgraph:latest
